[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qaos"
version = "0.1.0"
description = "Qaasim April AI Operating System"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

authors = [
    { name = "Qaasim April" }
]

dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
